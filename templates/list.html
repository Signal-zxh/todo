<h1>TODO List</h1>

<form action="/add" method="POST">
    <input type="text" name="task" placeholder="写一个新任务..." required>
    <button type="submit">添加</button>
</form>

<ul>
    {{range .}}
        <li>
            {{if .Done}}✅{{else}}⭕{{end}}
            {{.Task}}
            {{if not .Done}}
                <a href="/done/{{.ID}}">完成</a>
            {{end}}
        </li>
    {{end}}
</ul>
